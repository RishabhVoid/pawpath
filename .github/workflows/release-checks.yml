name: Release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:release
        env:
          NODE_ENV: production
      - run: pnpm warmup
      - run: pnpm warmup
        env:
          PAWPATH_OFFLINE: 'true'
